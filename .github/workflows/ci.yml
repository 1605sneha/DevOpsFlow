name: DevOpsFlow CI Pipeline

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select deployment environment"
        required: true
        type: choice
        options:
          - development
          - testing
          - production

  push:
    branches:
      - main

permissions:
  contents: read
  deployments: write

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: devopsflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d devopsflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build Spring Boot Application
        working-directory: ./devopsflow
        env:
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/devopsflow_test
          SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
        run: mvn -B clean package

  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: ${{ github.event.inputs.environment || 'development' }}

    steps:
      - name: Display Deployment Environment
        run: |
          echo "Selected environment:"
          echo "${{ github.event.inputs.environment || 'development' }}"

      - name: Start Deployment
        run: echo "Deployment started"

      - name: Simulate Deployment
        run: |
          echo "Deploying DevOpsFlow..."
          echo "Deployment environment: ${{ github.event.inputs.environment || 'development' }}"
          echo "Deployment completed successfully!"

      - name: Deployment Successful
        run: echo "Deployment simulation successful!"
