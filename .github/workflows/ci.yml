
name: DevOpsFlow CI Pipeline

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select deployment environment"
        required: true
        type: choice
        options:
          - development
          - testing
          - production

  push:
    branches:
      - main

permissions:
  contents: read
  deployments: write

j
  build:
    name: Build and Test Spring Boot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: '**/pom.xml'

      - name: Build and Test Application
        run: mvn -B clean verify
        working-directory: ./devopsflow

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: devopsflow-jar
          path: devopsflow/target/*.jar
          if-no-files-found: error


  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'development' }}
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: ${{ github.event.inputs.environment || 'development' }}

    steps:
      - name: Display Deployment Environment
        run: |
          echo "Selected environment:"
          echo "${{ github.event.inputs.environment || 'development' }}"

      - name: Start Deployment
        run: echo "Deployment started"

      - name: Simulate Deployment
        run: |
          echo "Deploying DevOpsFlow..."
          echo "Deployment completed successfully!"

      - name: Deployment Successful
        run: echo "Deployment successful!"
