name: DevOpsFlow CI/CD

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Select deployment environment
        required: true
        default: development
        type: choice
        options:
          - development
          - testing
          - production
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: devopsflow-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and Test Spring Boot
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: devopsflow/pom.xml

      - name: Build and Test Application
        run: mvn -B clean verify
        working-directory: ./devopsflow

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: devopsflow-jar
          path: devopsflow/target/*.jar
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to ${{ inputs.environment || 'development' }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15

    environment:
      name: ${{ inputs.environment || 'development' }}

    env:
      TARGET_ENV: ${{ inputs.environment || 'development' }}

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: devopsflow-jar
          path: ./artifacts

      - name: Verify Build Artifact
        run: ls -lah ./artifacts

      - name: Deploy Application
        run: |
          echo "Deploying DevOpsFlow to $TARGET_ENV"
          echo "Deployment completed successfully"
