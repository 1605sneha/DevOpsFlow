
name: DevOpsFlow CI Pipeline

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select deployment environment"
        required: true
        default: development
        type: choice
        options:
          - development
          - testing
          - production

  push:
    branches:
      - main

permissions:
  contents: read
  deployments: write

jobs:
  build:
    name: Build and Test Spring Boot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Locate Maven Project
        id: maven
        shell: bash
        run: |
          echo "Inspecting repository..."

          find . -name pom.xml -type f -print

          POM_FILE=$(find . -name pom.xml -type f \
            -not -path '*/target/*' | head -n 1)

          if [ -z "$POM_FILE" ]; then
            echo "::error::No pom.xml found in the repository."
            echo "Commit your Spring Boot project to GitHub first."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$POM_FILE")

          echo "Maven project directory: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build and Test Application
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd "${{ steps.maven.outputs.project_dir }}"
          mvn -B clean verify

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: devopsflow-jar
          path: |
            **/target/*.jar
            !**/target/*-sources.jar
            !**/target/*-javadoc.jar
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'development' }}
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: ${{ github.event.inputs.environment || 'development' }}

    steps:
      - name: Display Deployment Environment
        run: |
          echo "Selected environment:"
          echo "${{ github.event.inputs.environment || 'development' }}"

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: devopsflow-jar
          path: ./artifacts

      - name: Verify Build Artifact
        shell: bash
        run: |
          echo "Checking generated application JAR..."
          ls -lah ./artifacts

          if ! find ./artifacts -name "*.jar" -type f | grep -q .; then
            echo "::error::No JAR artifact found."
            exit 1
          fi

      - name: Start Deployment
        run: echo "Deployment started"

      - name: Simulate Deployment
        run: |
          echo "Deploying DevOpsFlow..."
          echo "Deployment environment: ${{ github.event.inputs.environment || 'development' }}"
          echo "Deployment completed successfully!"

      - name: Deployment Successful
        run: echo "Deployment simulation successful!"
